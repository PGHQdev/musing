<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:1280px; height:800px; overflow:hidden; }
  body {
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    background: linear-gradient(160deg,#16324a 0%,#1c3f5c 45%,#8a3324 100%);
    position:relative;
    display:flex; flex-direction:column; align-items:center;
  }
  .rays { position:absolute; inset:0; opacity:0.12;
    background: repeating-conic-gradient(from 0deg at 50% -20%, #f2a33b 0deg 8deg, transparent 8deg 16deg);
  }
  .headline { position:relative; z-index:2; margin-top:64px; text-align:center; }
  .headline h1 { color:#fdf3e0; font-size:2.6rem; font-weight:800; letter-spacing:-0.01em; margin-bottom:0.6rem; }
  .headline p { color:#f2c99b; font-size:1.15rem; font-weight:500; }
  .sources { position:relative; z-index:2; display:flex; gap:1rem; margin-top:2.2rem; }
  .source-chip { background:rgba(253,243,224,0.1); border:1px solid rgba(253,243,224,0.25); color:#fdf3e0; padding:0.55rem 1.1rem; border-radius:999px; font-size:0.92rem; font-weight:600; display:flex; align-items:center; gap:0.5rem; }
  .dot { width:8px; height:8px; border-radius:50%; background:#f2a33b; }
  .browser { position:relative; z-index:2; margin-top:2.4rem; width:920px; border-radius:14px; overflow:hidden; box-shadow:0 30px 70px rgba(0,0,0,0.45); }
  .titlebar { background:#e8eaed; height:38px; display:flex; align-items:center; padding:0 14px; gap:8px; }
  .tl-dot { width:11px; height:11px; border-radius:50%; }
  .tl-dot.r { background:#ff5f57; } .tl-dot.y { background:#febc2e; } .tl-dot.g { background:#28c840; }
  .url { margin:0 auto; background:#fff; border-radius:6px; padding:5px 16px; font-size:0.8rem; color:#5f6368; width:340px; text-align:center; }
  .page { background:#fff; height:400px; display:flex; flex-direction:column; align-items:center; justify-content:center; font-family:Georgia,serif; position:relative; }
  .quote { font-size:1.5rem; font-style:italic; color:#202124; max-width:640px; text-align:center; line-height:1.55; margin-bottom:1.1rem; }
  .quote::before { content:'"'; color:#1a73e8; font-size:2.6rem; vertical-align:-0.35em; margin-right:0.1em; line-height:0; }
  .quote::after { content:'"'; color:#1a73e8; font-size:2.6rem; vertical-align:-0.35em; margin-left:0.1em; line-height:0; }
  .author { font-size:1rem; color:#5f6368; letter-spacing:0.05em; }
  .author::before { content:'— '; }
  .chips { margin-top:1.2rem; display:flex; gap:0.5rem; }
  .chip { font-family:-apple-system,sans-serif; font-size:0.78rem; color:#1a73e8; background:rgba(26,115,232,0.08); border:1px solid rgba(26,115,232,0.25); padding:0.32rem 0.7rem; border-radius:999px; box-shadow:0 0 0 3px rgba(26,115,232,0.12); }
</style>
</head>
<body>
  <div class="rays"></div>
  <div class="headline">
    <h1>Quotes matched to your mind</h1>
    <p>musing learns themes from your Claude, ChatGPT &amp; Gemini chats — all on-device</p>
  </div>
  <div class="sources">
    <span class="source-chip"><span class="dot"></span>Claude</span>
    <span class="source-chip"><span class="dot"></span>ChatGPT</span>
    <span class="source-chip"><span class="dot"></span>Gemini</span>
  </div>
  <div class="browser">
    <div class="titlebar">
      <span class="tl-dot r"></span><span class="tl-dot y"></span><span class="tl-dot g"></span>
      <span class="url">New Tab</span>
    </div>
    <div class="page">
      <p class="quote">The only true wisdom is in knowing you know nothing.</p>
      <p class="author">Socrates</p>
      <div class="chips">
        <span class="chip">philosophy</span>
        <span class="chip">learning</span>
        <span class="chip">curiosity</span>
      </div>
    </div>
  </div>
</body>
</html>
