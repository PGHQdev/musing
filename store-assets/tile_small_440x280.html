<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:100%; height:100vh; overflow:hidden; }
  body {
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    background: linear-gradient(160deg,#16324a 0%,#1c3f5c 45%,#8a3324 100%);
    position:relative;
    display:flex; align-items:center; justify-content:center;
  }
  .rays { position:absolute; inset:0; opacity:0.14;
    background: repeating-conic-gradient(from 0deg at 50% 50%, #f2a33b 0deg 8deg, transparent 8deg 16deg);
  }
  .content { position:relative; z-index:2; display:flex; align-items:center; gap:1.3rem; padding:0 1.8rem; }
  .icon { width:118px; height:118px; border-radius:26px; box-shadow:0 14px 34px rgba(0,0,0,0.4); flex-shrink:0; }
  .text h1 { color:#fdf3e0; font-size:2.1rem; font-weight:800; letter-spacing:-0.01em; margin-bottom:0.35rem; }
  .text p { color:#f2c99b; font-size:0.95rem; font-weight:500; line-height:1.35; max-width:220px; }
</style>
</head>
<body>
  <div class="rays"></div>
  <div class="content">
    <img class="icon" src="../extension/icons/icon128.png">
    <div class="text">
      <h1>musing</h1>
      <p>Quotes for every new tab, learned locally from your AI chats</p>
    </div>
  </div>
</body>
</html>
